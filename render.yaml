services:
  - type: web
    name: creatorspark
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn creatorspark.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: "/health/"
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: creatorspark-db
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: "creatorspark_db"
      - key: PEXELS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"

databases:
  - name: creatorspark-db
    databaseName: creatorspark
    user: creatorspark_user
    plan: free
