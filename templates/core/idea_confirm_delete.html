{% extends 'base.html' %}

{% block title %}Delete Idea — CreatorSpark{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
        <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
        <h3 class="fw-bold mb-2">Delete Content Idea?</h3>
        <p class="text-muted small mb-4">
          Are you sure you want to delete <strong>"{{ idea.title }}"</strong> from your saved library? This action cannot be undone.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'idea_detail' idea.id %}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 fw-bold">Yes, Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
