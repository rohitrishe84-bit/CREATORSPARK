{% extends 'base.html' %}

{% block title %}Delete Post — CreatorSpark{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
        <i class="bi bi-calendar-x text-danger fs-1 mb-3"></i>
        <h3 class="fw-bold mb-2">Remove from Schedule?</h3>
        <p class="text-muted small mb-4">
          Are you sure you want to remove <strong>"{{ entry.title }}"</strong> scheduled for {{ entry.scheduled_date }}?
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'planner' %}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 fw-bold">Yes, Remove</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
